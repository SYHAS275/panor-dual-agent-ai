apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: panorai-ingress
  namespace: panorai
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - panorai.example.com
      secretName: panorai-tls
  rules:
    - host: panorai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: panorai-service
                port:
                  number: 80
